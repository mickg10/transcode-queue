services:
  transcode-queue:
    image: ghcr.io/mickg10/transcode-queue:latest
    build:
      context: .
      network: host
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8765}:8080"
    environment:
      MEDIA_ROOT: /media/photos
      DATA_DIR: /data
      START_PAUSED: "true"
    volumes:
      - "${MEDIA_PHOTOS:-./test-media}:/media/photos"
      - "${DATA_DIR:-./data}:/data"
